name: Shared Typst Compiler

on:
  workflow_call:
    inputs:
      source_file:
        description: 'The path to the main .typ file'
        required: true
        type: string
      output_file:
        description: 'The desired path/name for the output PDF'
        required: true
        type: string

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Typst Environment
        uses: typst-community/setup-typst@v5

      - name: Compile Typst via Bash
        shell: bash
        run: |
          echo "Starting document compilation..."
          typst compile "${{ inputs.source_file }}" "${{ inputs.output_file }}"
          echo "Compilation complete!"